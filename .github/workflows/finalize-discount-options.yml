name: Finalize approved highlight options

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-discount-options.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch highlight dropdown
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('components/admin/catalog-editor.tsx')
          s = p.read_text()
          pattern = re.compile(
              r'\{Array\.from\(\{ length: 40 \}, \(_, index\) =>\s*\(index \+ 1\) \* 5000,?\s*\)\.map\(\(value\) => \('
          )
          replacement = '{[25000, 50000, 100000, 125000, 150000, 175000, 200000].map((value) => ('
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected 1 highlight option block, found {count}')
          p.write_text(s)
      - name: Typecheck
        run: |
          npm ci
          npm run typecheck
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-discount-options.yml
          git add components/admin/catalog-editor.tsx
          git commit -m "fix: use approved highlight discount choices"
          git pull --rebase origin main
          git push
