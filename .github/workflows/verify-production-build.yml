name: Verify production build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-production-build.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "services/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
