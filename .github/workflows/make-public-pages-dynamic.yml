name: Make public pages dynamic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/make-public-pages-dynamic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark data-backed public pages dynamic
        shell: python
        run: |
          from pathlib import Path
          marker = 'export const dynamic = "force-dynamic";\n\n'
          for filename in ['app/page.tsx', 'app/catalog/page.tsx']:
              p = Path(filename)
              s = p.read_text()
              if 'export const dynamic = "force-dynamic";' not in s:
                  p.write_text(marker + s)
      - name: Typecheck
        run: |
          npm ci
          npm run typecheck
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/make-public-pages-dynamic.yml
          git add app/page.tsx app/catalog/page.tsx
          git commit -m "fix: keep Supabase public pages dynamic at build time"
          git push
