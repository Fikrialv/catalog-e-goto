name: One-time prune superseded E-Goto branches

on:
  push:
    branches: [fix/admin-pricing-voucher-dates]
    paths: [".github/workflows/one-time-prune-branches.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify that superseded refs have not changed
        run: |
          set -euo pipefail
          git fetch origin             "refs/heads/deploy/cloudflare-opennext:refs/remotes/origin/deploy/cloudflare-opennext"             "refs/heads/fix/catalog-cross-month:refs/remotes/origin/fix/catalog-cross-month"             "refs/heads/fix/cross-month-draft-schedules:refs/remotes/origin/fix/cross-month-draft-schedules"
          test "$(git rev-parse refs/remotes/origin/deploy/cloudflare-opennext)" = "bf99b79d78813cb00eb039896b7f6ef9d3a175c3"
          test "$(git rev-parse refs/remotes/origin/fix/catalog-cross-month)" = "04624eb37660f781a447b8b9aa0f0aa762dec154"
          test "$(git rev-parse refs/remotes/origin/fix/cross-month-draft-schedules)" = "2a90b913ced252163d281fb54c85ad7b34b05400"
      - name: Delete only the three agreed obsolete branches
        run: |
          set -euo pipefail
          git push origin --delete deploy/cloudflare-opennext
          git push origin --delete fix/catalog-cross-month
          git push origin --delete fix/cross-month-draft-schedules
      - name: Verify three-branch topology
        run: |
          set -euo pipefail
          git ls-remote --heads origin | awk '{print $2}' | sort
          count="$(git ls-remote --heads origin | wc -l)"
          test "$count" -eq 3
