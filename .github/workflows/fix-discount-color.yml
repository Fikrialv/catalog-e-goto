name: Fix discount color
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-discount-color.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i 's/className="block text-primary-dark"/className={`block ${selected ? "text-white" : "text-primary-dark"}`}/' components/catalog/trip-detail.tsx
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add components/catalog/trip-detail.tsx
          git commit -m "fix: selected discount price white"
          git push
