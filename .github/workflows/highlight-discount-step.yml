name: Highlight discount step

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/highlight-discount-step.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch-highlight-discount.py
      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/highlight-discount-step.yml scripts/patch-highlight-discount.py
          git add components/admin/catalog-editor.tsx lib/validation.ts
          git commit -m "feat: constrain highlight discounts to 5k increments"
          git push
