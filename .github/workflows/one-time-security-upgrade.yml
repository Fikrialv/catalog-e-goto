name: One-time secure production dependencies

on:
  push:
    branches: [fix/admin-pricing-voucher-dates]
    paths: [".github/workflows/one-time-security-upgrade.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Upgrade vulnerable packages and lockfile
        run: |
          npm install --save-exact next@16.4.3 zod@4.6.6
          npm audit fix --omit=dev
          npm audit --omit=dev --audit-level=high
      - name: Commit verified dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"; exit 0
          fi
          git commit -m "security: update vulnerable production dependencies"
          git push origin HEAD:fix/admin-pricing-voucher-dates
